<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dewan Pak Law Associates - Legal QR & Image Generator</title>
    <!-- Official QRCode Library for 100% Real Scannable QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #334155;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Fixed Control Panel */
        .control-panel {
            background: #1e293b;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            width: 216mm;
            box-sizing: border-box;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .control-group {
            display: flex;
            flex-direction: column;
            font-size: 11px;
            font-weight: bold;
        }
        .control-group input, .control-group select {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            width: 85px;
            margin-top: 3px;
            font-size: 12px;
            outline: none;
        }
        .print-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        .print-btn:hover {
            background: #0369a1;
        }

        /* Legal Page Styling (8.5 x 14 inches) */
        .legal-page {
            width: 216mm;
            min-height: 356mm;
            background: #ffffff;
            margin: 0 auto;
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
            position: relative;
            box-sizing: border-box;
            padding-top: 50px;
            padding-bottom: 50px;
            padding-left: 25mm;
            padding-right: 25mm;
            display: flex;
            flex-direction: column;
        }

        /* Content Area */
        .content-box {
            flex: 1;
            position: relative;
        }
        
        /* Unlimited Full Page Textarea Styling */
        .editable-area {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-family: inherit;
            font-size: 16px;
            line-height: 1.6;
            color: #000000;
            resize: none;
            overflow: hidden;
            box-sizing: border-box;
            position: relative;
            z-index: 2; /* Text stays above or below based on image layer setting */
        }

        /* Image / Logo Floating Box */
        .image-container {
            position: absolute;
            top: 20mm;
            left: 20mm;
            display: none; /* Shown when image loaded */
            cursor: move;
        }
        .image-container img {
            display: block;
            max-width: none;
        }

        /* QR Code Dynamic Positioning Box */
        .qr-container {
            position: absolute;
            bottom: 20mm;
            right: 15mm;
            background: #ffffff;
            padding: 0;
            border: none;
            text-align: center;
            line-height: 0;
            z-index: 5;
        }
        #qrcode img, #qrcode canvas {
            display: block;
            margin: 0 auto;
        }

        /* Print Settings */
        @media print {
            body {
                background: none;
                padding: 0;
            }
            .control-panel, .screen-only-header {
                display: none !important;
            }
            .legal-page {
                box-shadow: none;
                margin: 0;
                width: 100%;
                min-height: 100vh;
            }
            .editable-area {
                overflow: visible;
            }
        }
    </style>
</head>
<body>

    <!-- Control Panel -->
    <div class="control-panel">
        <div class="control-group">
            <label for="top-margin">Upar Space:</label>
            <input type="number" id="top-margin" value="50" min="10" max="250" oninput="updateLayout()">
        </div>
        <div class="control-group">
            <label for="bottom-margin">Neeche Space:</label>
            <input type="number" id="bottom-margin" value="50" min="10" max="250" oninput="updateLayout()">
        </div>
        <div class="control-group">
            <label for="qr-size">QR Size:</label>
            <input type="number" id="qr-size" value="65" min="30" max="200" oninput="generateQR()">
        </div>
        <div class="control-group">
            <label for="img-file">Upload Logo/Pic:</label>
            <input type="file" id="img-file" accept="image/*" onchange="loadUserImage(event)" style="width: 100px; font-size: 10px;">
        </div>
        <div class="control-group">
            <label for="img-size">Pic Size (px):</label>
            <input type="number" id="img-size" value="120" min="20" max="500" oninput="updateImageStyle()">
        </div>
        <div class="control-group">
            <label for="img-layer">Layer Position:</label>
            <select id="img-layer" onchange="updateImageStyle()">
                <option value="behind">Likhawat ke Peeche</option>
                <option value="front">Likhawat ke Upar</option>
            </select>
        </div>
        <div class="control-group">
            <label for="img-left">Pic Left (mm):</label>
            <input type="number" id="img-left" value="20" min="0" max="200" oninput="updateImageStyle()">
        </div>
        <div class="control-group">
            <label for="img-top">Pic Top (mm):</label>
            <input type="number" id="img-top" value="20" min="0" max="300" oninput="updateImageStyle()">
        </div>
        <button class="print-btn" onclick="window.print()">🖨️ Print</button>
    </div>

    <!-- Legal Page Container -->
    <div class="legal-page" id="page-box">
        <!-- VIP Professional Header Label -->
        <div class="screen-only-header" style="font-size: 13px; font-weight: bold; color: #0f172a; margin-bottom: 15px; border-bottom: 2px solid #0284c7; padding-bottom: 8px; letter-spacing: 1px;">
            ⚖️ DEWAN PAK LAW ASSOCIATES — VIP LEGAL DOCUMENT PORTAL (Screen Guide)
        </div>
        
        <div class="content-box">
            <!-- Uploaded Image / Logo Element -->
            <div class="image-container" id="img-box">
                <img id="user-uploaded-img" src="" alt="Logo">
            </div>

            <!-- Unlimited Auto-Resizing Textarea -->
            <textarea class="editable-area" id="user-text" placeholder="Yahan poore page par apna lamba text likhein..." oninput="autoGrow(this); generateQR()">E-STAMP
(GOVERNMENT OF PUNJAB)

PB-LHR-AE739AEBB59A1425
PSID-40172604230730256
Rs 100/-
One Hundred Rupees Only</textarea>
        </div>

        <!-- QR Code Position Box -->
        <div class="qr-container" id="qr-box">
            <div id="qrcode"></div>
        </div>
    </div>

    <script>
        function autoGrow(element) {
            element.style.height = '5px';
            element.style.height = (element.scrollHeight) + 'px';
        }

        function updateLayout() {
            const topVal = document.getElementById('top-margin').value;
            const bottomVal = document.getElementById('bottom-margin').value;
            const pageBox = document.getElementById('page-box');
            
            pageBox.style.paddingTop = topVal + 'px';
            pageBox.style.paddingBottom = bottomVal + 'px';
        }

        function loadUserImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imgElement = document.getElementById('user-uploaded-img');
                    imgElement.src = e.target.result;
                    document.getElementById('img-box').style.display = 'block';
                    updateImageStyle();
                }
                reader.readAsDataURL(file);
            }
        }

        function updateImageStyle() {
            const imgBox = document.getElementById('img-box');
            const imgElement = document.getElementById('user-uploaded-img');
            const sizeVal = document.getElementById('img-size').value;
            const leftVal = document.getElementById('img-left').value;
            const topVal = document.getElementById('img-top').value;
            const layerVal = document.getElementById('img-layer').value;
            const textArea = document.getElementById('user-text');

            imgElement.style.width = sizeVal + 'px';
            imgBox.style.left = leftVal + 'mm';
            imgBox.style.top = topVal + 'mm';

            if (layerVal === 'behind') {
                imgBox.style.zIndex = '1';
                imgElement.style.opacity = '0.25'; // Watermark effect behind text
            } else {
                imgBox.style.zIndex = '10';
                imgElement.style.opacity = '1'; // Solid on top of text
            }
        }

        function generateQR() {
            const text = document.getElementById('user-text').value;
            const sizeVal = parseInt(document.getElementById('qr-size').value) || 65;
            
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = ""; 
            
            try {
                qrContainer.style.width = sizeVal + 'px';
                qrContainer.style.height = sizeVal + 'px';

                new QRCode(qrContainer, {
                    text: text.trim() === "" ? "ILYAS" : text,
                    width: sizeVal,
                    height: sizeVal,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.L
                });

                setTimeout(() => {
                    const qrChild = qrContainer.querySelector('img, canvas');
                    if (qrChild) {
                        qrChild.style.width = sizeVal + 'px';
                        qrChild.style.height = sizeVal + 'px';
                    }
                }, 10);
            } catch (err) {
                console.log(err);
            }
        }

        window.onload = function() {
            const ta = document.getElementById('user-text');
            autoGrow(ta);
            generateQR();
        };
    </script>

</body>
</html>
