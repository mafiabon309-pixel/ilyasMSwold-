<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilyas Legal Page QR Generator</title>
    <!-- Official QRCode Library for 100% Real Scannable QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #334155;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Fixed Control Panel */
        .control-panel {
            background: #1e293b;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            width: 216mm;
            box-sizing: border-box;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .control-group {
            display: flex;
            flex-direction: column;
            font-size: 11px;
            font-weight: bold;
        }
        .control-group input {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            width: 75px;
            margin-top: 3px;
            font-size: 13px;
            outline: none;
        }
        .print-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        .print-btn:hover {
            background: #0369a1;
        }

        /* Legal Page Styling (8.5 x 14 inches) */
        .legal-page {
            width: 216mm;
            min-height: 356mm;
            background: #ffffff;
            margin: 0 auto;
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
            position: relative;
            box-sizing: border-box;
            padding-top: 50px;
            padding-bottom: 50px;
            padding-left: 25mm;
            padding-right: 25mm;
            display: flex;
            flex-direction: column;
        }

        /* Content Area */
        .content-box {
            flex: 1;
            position: relative;
        }
        .editable-area {
            width: 100%;
            min-height: 250px;
            font-size: 16px;
            border: none;
            outline: none;
            background: transparent;
            font-family: inherit;
            resize: none;
            line-height: 1.6;
            color: #000000;
        }

        /* QR Code Dynamic Positioning Box */
        .qr-container {
            position: absolute;
            bottom: 20mm;
            right: 15mm;
            background: #ffffff;
            padding: 0;
            border: none;
            text-align: center;
        }
        #qrcode img {
            display: block;
            margin: 0 auto;
        }

        /* Print Settings */
        @media print {
            body {
                background: none;
                padding: 0;
            }
            .control-panel, .screen-only-header {
                display: none !important;
            }
            .legal-page {
                box-shadow: none;
                margin: 0;
                width: 100%;
                min-height: 100vh;
            }
        }
    </style>
</head>
<body>

    <!-- Control Panel -->
    <div class="control-panel">
        <div class="control-group">
            <label for="top-margin">Upar Space:</label>
            <input type="number" id="top-margin" value="50" min="10" max="250" oninput="updateLayout()">
        </div>
        <div class="control-group">
            <label for="bottom-margin">Neeche Space:</label>
            <input type="number" id="bottom-margin" value="50" min="10" max="250" oninput="updateLayout()">
        </div>
        <div class="control-group">
            <label for="qr-size">QR Size:</label>
            <input type="number" id="qr-size" value="65" min="40" max="150" oninput="generateQR()">
        </div>
        <div class="control-group">
            <label for="qr-updown">QR Upar/Neeche:</label>
            <input type="number" id="qr-updown" value="20" min="0" max="300" oninput="updateQRPosition()">
        </div>
        <div class="control-group">
            <label for="qr-leftright">QR Side (Left/Right):</label>
            <input type="number" id="qr-leftright" value="15" min="0" max="200" oninput="updateQRPosition()">
        </div>
        <button class="print-btn" onclick="window.print()">🖨️ Print</button>
    </div>

    <!-- Legal Page Container -->
    <div class="legal-page" id="page-box">
        <div class="screen-only-header" style="font-size: 12px; color: #64748b; margin-bottom: 15px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 5px;">
            DEWAN PAK LAW ASSOCIATES (Screen Guide - Will not appear in Print)
        </div>
        
        <div class="content-box">
            <textarea class="editable-area" id="user-text" placeholder="Yahan apna text likhein..." oninput="generateQR()">Ilyas Maqbool Legal Document Verified</textarea>
        </div>

        <!-- QR Code Position Box -->
        <div class="qr-container" id="qr-box">
            <div id="qrcode"></div>
        </div>
    </div>

    <script>
        function updateLayout() {
            const topVal = document.getElementById('top-margin').value;
            const bottomVal = document.getElementById('bottom-margin').value;
            const pageBox = document.getElementById('page-box');
            
            pageBox.style.paddingTop = topVal + 'px';
            pageBox.style.paddingBottom = bottomVal + 'px';
        }

        function updateQRPosition() {
            const upDownVal = document.getElementById('qr-updown').value;
            const leftRightVal = document.getElementById('qr-leftright').value;
            const qrBox = document.getElementById('qr-box');

            qrBox.style.bottom = upDownVal + 'mm';
            qrBox.style.right = leftRightVal + 'mm';
        }

        function generateQR() {
            const text = document.getElementById('user-text').value;
            const sizeVal = parseInt(document.getElementById('qr-size').value) | 65;
            
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = ""; 
            
            try {
                new QRCode(qrContainer, {
                    text: text.trim() === "" ? "ILYAS" : text,
                    width: sizeVal,
                    height: sizeVal,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            } catch (err) {
                console.log(err);
            }
        }

        window.onload = function() {
            generateQR();
            updateQRPosition();
        };
    </script>

</body>
</html>
