<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dewan Pak Law Associates - Multi-Pic & Legal Portal</title>
    <!-- Official QRCode Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #334155;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Main Control Panel */
        .control-panel {
            background: #1e293b;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            width: 216mm;
            box-sizing: border-box;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .control-group {
            display: flex;
            flex-direction: column;
            font-size: 11px;
            font-weight: bold;
        }
        .control-group input, .control-group select {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            width: 90px;
            margin-top: 3px;
            font-size: 12px;
            outline: none;
        }
        
        /* Individual Separate Pic Box Styling */
        .pic-control-panel {
            background: #0f172a;
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            width: 216mm;
            box-sizing: border-box;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border: 1px dashed #334155;
        }
        .pic-box-item {
            background: #1e293b;
            padding: 8px;
            border-radius: 6px;
            flex: 1;
            min-width: 170px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 11px;
            font-weight: bold;
        }
        .pic-box-item input, .pic-box-item select {
            padding: 4px;
            border-radius: 4px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 11px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }
        .row-inputs {
            display: flex;
            gap: 4px;
        }

        .print-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        .print-btn:hover {
            background: #0369a1;
        }

        /* Legal Page Styling */
        .legal-page {
            width: 216mm;
            min-height: 356mm;
            background: #ffffff;
            margin: 0 auto;
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
            position: relative;
            box-sizing: border-box;
            padding-top: 50px;
            padding-bottom: 50px;
            padding-left: 10px;
            padding-right: 10px;
            display: flex;
            flex-direction: column;
        }

        .content-box {
            flex: 1;
            position: relative;
            width: 100%;
        }
        
        /* Editable Text Area */
        .editable-area {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 16px;
            line-height: 1.6;
            color: #000000;
            box-sizing: border-box;
            position: relative;
            z-index: 2;
            padding: 0;
            margin: 0;
        }

        /* 5 Picture Containers Styling */
        .img-container {
            position: absolute;
            display: none;
            cursor: move;
        }
        .img-container img {
            display: block;
            max-width: none;
            opacity: 1 !important; /* Full clarity without fading */
            filter: none !important;
        }

        /* QR Code Box */
        .qr-container {
            position: absolute;
            bottom: 20mm;
            right: 15mm;
            background: #ffffff;
            padding: 0;
            border: none;
            text-align: center;
            line-height: 0;
            z-index: 20;
        }
        #qrcode img, #qrcode canvas {
            display: block;
            margin: 0 auto;
        }

        @media print {
            body { background: none; padding: 0; }
            .control-panel, .pic-control-panel, .screen-only-header { display: none !important; }
            .legal-page { box-shadow: none; margin: 0; width: 100%; min-height: 100vh; }
            .editable-area { overflow: visible; }
        }
    </style>
</head>
<body>

    <!-- Main Control Panel -->
    <div class="control-panel">
        <div class="control-group">
            <label for="top-margin">Upar Space:</label>
            <input type="number" id="top-margin" value="50" min="10" max="250" oninput="updateLayout()">
        </div>
        <div class="control-group">
            <label for="bottom-margin">Neeche Space:</label>
            <input type="number" id="bottom-margin" value="50" min="10" max="250" oninput="updateLayout()">
        </div>
        <div class="control-group">
            <label for="qr-size">QR Size:</label>
            <input type="number" id="qr-size" value="65" min="30" max="200" oninput="generateQR()">
        </div>
        <div class="control-group">
            <label for="font-family-select">Font Style (A-Z):</label>
            <select id="font-family-select" onchange="changeFontStyle()">
                <option value="Arial">Arial</option>
                <option value="Courier New">Courier New</option>
                <option value="Georgia">Georgia</option>
                <option value="Times New Roman">Times New Roman</option>
                <option value="Verdana">Verdana</option>
                <option value="Trebuchet MS">Trebuchet MS</option>
                <option value="Impact">Impact</option>
                <option value="Comic Sans MS">Comic Sans MS</option>
                <option value="Lucida Console">Lucida Console</option>
                <option value="Palatino Linotype">Palatino Linotype</option>
            </select>
        </div>
        <div class="control-group">
            <label for="selected-font-size">Selected Text Size:</label>
            <select id="selected-font-size" onchange="applySelectedFontSize(this.value)">
                <option value="">Select Size</option>
                <option value="1">1 (10px)</option>
                <option value="2">2 (13px)</option>
                <option value="3">3 (16px)</option>
                <option value="4">4 (18px)</option>
                <option value="5">5 (24px)</option>
                <option value="6">6 (32px)</option>
                <option value="7">7 (48px)</option>
            </select>
        </div>
        <button class="print-btn" onclick="window.print()">🖨️ Print</button>
    </div>

    <!-- Separate Individual Control Boxes for Each Picture (Pic 1 to 5) -->
    <div class="pic-control-panel">
        <!-- Pic 1 Box -->
        <div class="pic-box-item">
            <span>📷 Picture 1 Box</span>
            <input type="file" accept="image/*" onchange="loadPic(event, 1)">
            <div class="row-inputs">
                <input type="number" id="p1-sz" value="100" placeholder="Size" title="Size" oninput="updatePic(1)">
                <input type="number" id="p1-l" value="10" placeholder="Left" title="Left" oninput="updatePic(1)">
            </div>
            <div class="row-inputs">
                <input type="number" id="p1-t" value="10" placeholder="Top" title="Top" oninput="updatePic(1)">
                <select id="p1-layer" title="Layer" onchange="updatePic(1)">
                    <option value="1">Behind Text</option>
                    <option value="15">Front Text</option>
                </select>
            </div>
        </div>

        <!-- Pic 2 Box -->
        <div class="pic-box-item">
            <span>📷 Picture 2 Box</span>
            <input type="file" accept="image/*" onchange="loadPic(event, 2)">
            <div class="row-inputs">
                <input type="number" id="p2-sz" value="100" placeholder="Size" title="Size" oninput="updatePic(2)">
                <input type="number" id="p2-l" value="50" placeholder="Left" title="Left" oninput="updatePic(2)">
            </div>
            <div class="row-inputs">
                <input type="number" id="p2-t" value="10" placeholder="Top" title="Top" oninput="updatePic(2)">
                <select id="p2-layer" title="Layer" onchange="updatePic(2)">
                    <option value="1">Behind Text</option>
                    <option value="15">Front Text</option>
                </select>
            </div>
        </div>

        <!-- Pic 3 Box -->
        <div class="pic-box-item">
            <span>📷 Picture 3 Box</span>
            <input type="file" accept="image/*" onchange="loadPic(event, 3)">
            <div class="row-inputs">
                <input type="number" id="p3-sz" value="100" placeholder="Size" title="Size" oninput="updatePic(3)">
                <input type="number" id="p3-l" value="90" placeholder="Left" title="Left" oninput="updatePic(3)">
            </div>
            <div class="row-inputs">
                <input type="number" id="p3-t" value="10" placeholder="Top" title="Top" oninput="updatePic(3)">
                <select id="p3-layer" title="Layer" onchange="updatePic(3)">
                    <option value="1">Behind Text</option>
                    <option value="15">Front Text</option>
                </select>
            </div>
        </div>

        <!-- Pic 4 Box -->
        <div class="pic-box-item">
            <span>📷 Picture 4 Box</span>
            <input type="file" accept="image/*" onchange="loadPic(event, 4)">
            <div class="row-inputs">
                <input type="number" id="p4-sz" value="100" placeholder="Size" title="Size" oninput="updatePic(4)">
                <input type="number" id="p4-l" value="130" placeholder="Left" title="Left" oninput="updatePic(4)">
            </div>
            <div class="row-inputs">
                <input type="number" id="p4-t" value="10" placeholder="Top" title="Top" oninput="updatePic(4)">
                <select id="p4-layer" title="Layer" onchange="updatePic(4)">
                    <option value="1">Behind Text</option>
                    <option value="15">Front Text</option>
                </select>
            </div>
        </div>

        <!-- Pic 5 Box -->
        <div class="pic-box-item">
            <span>📷 Picture 5 Box</span>
            <input type="file" accept="image/*" onchange="loadPic(event, 5)">
            <div class="row-inputs">
                <input type="number" id="p5-sz" value="100" placeholder="Size" title="Size" oninput="updatePic(5)">
                <input type="number" id="p5-l" value="170" placeholder="Left" title="Left" oninput="updatePic(5)">
            </div>
            <div class="row-inputs">
                <input type="number" id="p5-t" value="10" placeholder="Top" title="Top" oninput="updatePic(5)">
                <select id="p5-layer" title="Layer" onchange="updatePic(5)">
                    <option value="1">Behind Text</option>
                    <option value="15">Front Text</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Legal Page Container -->
    <div class="legal-page" id="page-box">
        <div class="screen-only-header" style="font-size: 13px; font-weight: bold; color: #0f172a; margin-bottom: 15px; border-bottom: 2px solid #0284c7; padding-bottom: 8px; letter-spacing: 1px;">
            ⚖️ DEWAN PAK LAW ASSOCIATES — MULTI-PIC LEGAL PORTAL
        </div>
        
        <div class="content-box">
            <!-- 5 Image Elements -->
            <div class="img-container" id="img-box-1"><img id="img-el-1" src="" alt="Pic 1"></div>
            <div class="img-container" id="img-box-2"><img id="img-el-2" src="" alt="Pic 2"></div>
            <div class="img-container" id="img-box-3"><img id="img-el-3" src="" alt="Pic 3"></div>
            <div class="img-container" id="img-box-4"><img id="img-el-4" src="" alt="Pic 4"></div>
            <div class="img-container" id="img-box-5"><img id="img-el-5" src="" alt="Pic 5"></div>

            <!-- Content Editable Area -->
            <div class="editable-area" id="user-text" contenteditable="true" oninput="generateQR()" style="min-height: 450px;">E-STAMP (GOVERNMENT OF PUNJAB) PB-LHR-AE739AEBB59A1425 PSID-40172604230730256 Rs 100/- One Hundred Rupees Only</div>
        </div>

        <!-- QR Code Position Box -->
        <div class="qr-container" id="qr-box">
            <div id="qrcode"></div>
        </div>
    </div>

    <script>
        function updateLayout() {
            const topVal = document.getElementById('top-margin').value;
            const bottomVal = document.getElementById('bottom-margin').value;
            const pageBox = document.getElementById('page-box');
            pageBox.style.paddingTop = topVal + 'px';
            pageBox.style.paddingBottom = bottomVal + 'px';
        }

        function changeFontStyle() {
            const fontVal = document.getElementById('font-family-select').value;
            document.getElementById('user-text').style.fontFamily = fontVal;
        }

        function applySelectedFontSize(sizeIndex) {
            if (!sizeIndex) return;
            document.execCommand('fontSize', false, sizeIndex);
            generateQR();
            document.getElementById('selected-font-size').value = "";
        }

        function loadPic(event, index) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('img-el-' + index).src = e.target.result;
                    document.getElementById('img-box-' + index).style.display = 'block';
                    updatePic(index);
                }
                reader.readAsDataURL(file);
            }
        }

        function updatePic(index) {
            const box = document.getElementById('img-box-' + index);
            const img = document.getElementById('img-el-' + index);
            const sz = document.getElementById('p' + index + '-sz').value;
            const l = document.getElementById('p' + index + '-l').value;
            const t = document.getElementById('p' + index + '-t').value;
            const layer = document.getElementById('p' + index + '-layer').value;

            img.style.width = sz + 'px';
            box.style.left = l + 'mm';
            box.style.top = t + 'mm';
            box.style.zIndex = layer;
            img.style.opacity = '1';
        }

        function generateQR() {
            const text = document.getElementById('user-text').innerText;
            const sizeVal = parseInt(document.getElementById('qr-size').value) || 65;
            
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = ""; 
            
            try {
                qrContainer.style.width = sizeVal + 'px';
                qrContainer.style.height = sizeVal + 'px';

                new QRCode(qrContainer, {
                    text: text.trim() === "" ? "ILYAS" : text,
                    width: sizeVal,
                    height: sizeVal,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.L
                });

                setTimeout(() => {
                    const qrChild = qrContainer.querySelector('img, canvas');
                    if (qrChild) {
                        qrChild.style.width = sizeVal + 'px';
                        qrChild.style.height = sizeVal + 'px';
                    }
                }, 10);
            } catch (err) {
                console.log(err);
            }
        }

        window.onload = function() {
            generateQR();
        };
    </script>

</body>
</html>
